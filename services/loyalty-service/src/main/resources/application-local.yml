spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/loyaltydb
    username: loyalty
    password: loyalty
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    com.letzautomate.loyalty: INFO
